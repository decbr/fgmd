# publishes to npm when a version tag is pushed, then creates the matching GitHub release:
#
#   npm version patch        # or minor / major: bumps, commits, tags vX.Y.Z
#   git push --follow-tags
#
# uses npm trusted publishing (OIDC), so there's no token to store or leak, and every release
# gets a provenance attestation linking it to this workflow run. one-time setup on npmjs.com:
# package settings -> Trusted publishing -> GitHub Actions, user decbr, repository fgmd,
# workflow publish.yml.
name: publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  # lets the job prove to npm which repository and workflow it is
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME doesn't match package.json version $version"
            exit 1
          fi

      - run: npm run check
      - run: npm test

      # trusted publishing needs npm 11.5.1 or newer
      - run: npm install -g npm@latest

      # prepack builds dist/ first
      - run: npm publish

  # turns the tag into a GitHub release once npm has the package, so the releases page matches
  # npm's version list. notes are the commits since the previous tag, minus the version bump.
  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          # full history and tags, to find the previous tag
          fetch-depth: 0

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name=$(node -p "require('./package.json').name")
          version=${GITHUB_REF_NAME#v}
          prev=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
          {
            echo "**npm:** [$name@$version](https://www.npmjs.com/package/$name/v/$version)"
            echo
            echo "## Changes"
            echo
            git log --format='- %s (%h)' ${prev:+"$prev.."}"$GITHUB_REF_NAME" | grep -v 'chore: bump version to' || true
            if [ -n "$prev" ]; then
              echo
              echo "**Full changelog:** https://github.com/$GITHUB_REPOSITORY/compare/$prev...$GITHUB_REF_NAME"
            fi
          } > notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
